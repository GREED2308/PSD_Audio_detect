name: psd-audio-detect

services:
  psd-audio-detect:
    image: psd-audio-detect:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psd-audio-detect
    restart: unless-stopped
    ports:
      - "8001:8080"
    environment:
      PORT: "8080"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
